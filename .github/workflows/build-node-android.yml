name: Build Node.js for Android

on:
  workflow_dispatch:
    inputs:
      node_version:
        description: "Node.js version (e.g. 24.2.0)"
        required: true
        default: "24.2.0"
        type: string
      android_api:
        description: "Android API level"
        required: true
        default: "24"
        type: string
      prerelease:
        description: "Publish the GitHub Release as a prerelease (untick for LTS/stable)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-arm64-v8a:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      NODE_VERSION: ${{ inputs.node_version || '24.2.0' }}
      ANDROID_API: ${{ inputs.android_api || '24' }}
      # Node 26+ (V8 14.6) needs clang >= 19.1.0 (C++20 std::atomic_ref). NDK r28
      # ships clang 19.0.1 and fails compiling deps/v8/src/base/atomicops.h; NDK r30
      # (30.0.16248370, stable channel-0) ships clang 21.0.0 and still targets API 24.
      NDK_VERSION: 30.0.16248370
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file make python3 unzip xz-utils

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/clt.zip
          unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"

      - name: Download and verify Node.js source
        run: |
          curl --fail --location --retry 3 --output "node-v${NODE_VERSION}.tar.xz" \
            "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}.tar.xz"
          curl --fail --location --retry 3 --output SHASUMS256.txt \
            "https://nodejs.org/dist/v${NODE_VERSION}/SHASUMS256.txt"
          grep " node-v${NODE_VERSION}.tar.xz$" SHASUMS256.txt | sha256sum --check
          tar -xf "node-v${NODE_VERSION}.tar.xz"

      - name: Build arm64-v8a shared library
        run: |
          ./scripts/build-node-android.sh \
            "$PWD/node-v${NODE_VERSION}" \
            "$ANDROID_HOME/ndk/${NDK_VERSION}" \
            "$PWD/dist" \
            "$ANDROID_API"

      - name: Verify build output
        run: |
          LIBNODE=dist/bin/arm64-v8a/libnode.so
          file "$LIBNODE"
          ls -lh dist/bin/arm64-v8a/
          # Shared object, AArch64, no interpreter
          readelf -h "$LIBNODE" | grep -E "Type:|Machine:"
          readelf -d "$LIBNODE" | grep -E "SONAME|NEEDED"
          # node::Start must be an exported DYNAMIC symbol (survives stripping)
          nm -D "$LIBNODE" | grep "node5Start"
          # 16 KB page alignment (NDK r28+ default; required by Play Store)
          echo "LOAD aligns:"; readelf -lW "$LIBNODE" | awk '/LOAD/{print $NF}' | sort -u
          if readelf -lW "$LIBNODE" | awk '/LOAD/{print strtonum($NF)}' | grep -Evx '16384'; then
            echo "ERROR: a LOAD segment is not 16 KB (0x4000) aligned" >&2; exit 1
          fi
          # libc++_shared.so MUST be bundled (libnode.so has a DT_NEEDED on it)
          test -f dist/bin/arm64-v8a/libc++_shared.so
          echo "--- BUILD-METADATA.txt ---"; cat dist/BUILD-METADATA.txt

      - name: Package output
        run: |
          archive="node-v${NODE_VERSION}-android-arm64-v8a.tar.gz"
          tar -C dist -czf "$archive" .
          sha256sum "$archive" > "$archive.sha256"
          echo "archive=${archive}" >> $GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-${{ env.NODE_VERSION }}-android-arm64-v8a
          path: |
            node-v${{ env.NODE_VERSION }}-android-arm64-v8a.tar.gz
            node-v${{ env.NODE_VERSION }}-android-arm64-v8a.tar.gz.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease || false }}
        run: |
          archive="node-v${NODE_VERSION}-android-arm64-v8a.tar.gz"
          notes="Cross-compiled, stripped libnode.so (shared library) + libc++_shared.so for Android arm64-v8a (API ${ANDROID_API}). Built with NDK ${NDK_VERSION}; see BUILD-METADATA.txt in the archive."
          preflag=(); [ "$PRERELEASE" = "true" ] && preflag=(--prerelease)
          if gh release view "v${NODE_VERSION}" >/dev/null 2>&1; then
            # Re-build: replace the assets on the existing release, pin its tag to
            # this exact build commit, sync prerelease flag.
            gh release upload "v${NODE_VERSION}" "$archive" "$archive.sha256" --clobber
            if [ "$PRERELEASE" = "true" ]; then
              gh release edit "v${NODE_VERSION}" --target "$GITHUB_SHA" --prerelease
            else
              gh release edit "v${NODE_VERSION}" --target "$GITHUB_SHA" --prerelease=false
            fi
          else
            # --target pins the tag v<NODE_VERSION> to THIS run's commit instead of
            # main's HEAD at publish time (the build takes ~2 h and main may move).
            gh release create "v${NODE_VERSION}" \
              "$archive" "$archive.sha256" \
              --target "$GITHUB_SHA" \
              --title "Node.js v${NODE_VERSION} for Android arm64-v8a" \
              --notes "$notes" \
              "${preflag[@]}"
          fi
