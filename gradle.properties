# ── 公共元数据（可提交）──────────────────────────────────────────────────────
GROUP=io.github.fellow99
VERSION_NAME=0.1.0
# 引擎版本 = Maven 坐标 version。注意：不能用 NODE_* 前缀——Gradle 9.4 把所有
# NODE_ 前缀属性保留给内置 Node 工具链，-P 覆盖会被忽略；故用 RUNTIME_VERSION。
# 多版本发布：-PRUNTIME_VERSION=<node 版本>（见 runtime.lock.json 的 releases）。
RUNTIME_VERSION=24.22.1
POM_NAME=node-runtime
POM_DESCRIPTION=Node.js v24 arm64-v8a runtime (libnode.so) for Android - cross-compiled shared library for in-process embedding
POM_URL=https://github.com/fellow99/aosp-node-runtime
POM_LICENCE_NAME=MIT License
POM_LICENCE_URL=https://opensource.org/licenses/MIT
POM_SCM_CONNECTION=scm:git:git://github.com/fellow99/aosp-node-runtime.git
POM_SCM_DEVELOPMENT_CONNECTION=scm:git:git://github.com/fellow99/aosp-node-runtime.git
POM_DEVELOPER_ID=fellow99
POM_DEVELOPER_NAME=fellow99

# 发布门禁（默认关；真实发布时 RELEASE=true + 用户级 gradle.properties 提供 Token/GPG）
RELEASE=false
